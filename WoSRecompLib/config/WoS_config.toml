# ============================================================================
#  Spider-Man: Web of Shadows — XenonRecomp configuration
# ============================================================================
#  See docs/02-config-guide.md for a full field-by-field explanation.
#
#  All required addresses are filled in and verified — see
#  docs/05-findings-log.md for provenance. Field semantics come from the
#  upstream XenonRecomp README: https://github.com/hedge-dev/XenonRecomp
# ============================================================================

# Paths resolve relative to THIS FILE'S directory — XenonRecomp does
# `config.directoryPath + <path>`, where directoryPath is the config's own
# folder. So "../../private/..." is <repo root>/private/...

[main]
file_path = "../../private/default.xex"
# No title update: the disc dump contains no default.xexp, so these stay
# commented and file_path points at the retail XEX directly. If a TU turns up
# later, uncomment both — it may fix retail bugs we'd otherwise hand-patch.
# patch_file_path = "../../private/default.xexp"
# patched_file_path = "../../private/default_patched.xex"
out_directory_path = "../ppc"
switch_table_file_path = "WoS_switch_tables.toml"   # 498 tables, from XenonAnalyse

# ----------------------------------------------------------------------------
# Optimization flags — leave everything false until you have a working build.
# ----------------------------------------------------------------------------
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# ----------------------------------------------------------------------------
# Register save/restore helper functions (compiler-emitted, Xenon ABI).
# REQUIRED.
#
# Located 2026-07-26 with:
#     tools/xex_info/build/xex_info private/default.xex --helpers
#
# All eight matched unambiguously, and their block sizes corroborate one
# another exactly — each gap equals the theoretical instruction count:
#   savegprlr_14 -> restgprlr_14 = 0x50  =  20 insns (18 std r14-r31 + std LR + blr)
#   savefpr_14   -> restfpr_14   = 0x4C  =  19 insns (18 stfd f14-f31 + blr)
#   savevmx_14   -> savevmx_64   = 0x94  =  37 insns (18 * (li+stvx) + blr)
#   savevmx_64   -> restvmx_14   = 0x204 = 129 insns (64 * (li+stvx128) + blr)
#   restvmx_14   -> restvmx_64   = 0x94  =  37 insns (mirrors the save side)
# All lie within .text (0x822C0000 .. 0x82BDC9AC). See docs/05-findings-log.md.
# ----------------------------------------------------------------------------
restgprlr_14_address = 0x82B24710
savegprlr_14_address = 0x82B246C0
restfpr_14_address   = 0x82B24AEC
savefpr_14_address   = 0x82B24AA0
restvmx_14_address   = 0x82B25448
savevmx_14_address   = 0x82B251B0
restvmx_64_address   = 0x82B254DC
savevmx_64_address   = 0x82B25244

# ----------------------------------------------------------------------------
# setjmp / longjmp — optional, but recommended once located.
# ----------------------------------------------------------------------------
# longjmp_address = 0x00000000  # TODO
# setjmp_address  = 0x00000000  # TODO

# ----------------------------------------------------------------------------
# Explicit function boundary overrides.
# Add entries here whenever the analyser mis-detects a function's start/size.
# Expect this list to grow steadily during bring-up — that's normal iterative
# work, not a sign something is wrong.
#
# CURRENTLY EMPTY — a first generated batch had to be reverted, see below.
#
# Why these are needed: .pdata (0x8227F000, 29,942 records) does NOT describe
# every function — leaf functions that never unwind get no entry. 112 of the
# 498 switch sites sit in the gaps between records, so XenonRecomp never
# registers those functions from .pdata and falls back to a heuristic branch
# scan that sizes them too small, putting their switch targets out of bounds.
#
# Starts are recovered by disassembling backwards to the previous function's
# terminator, clamped against neighbouring .pdata records, then overlapping
# extents merged.
#
# IMPORTANT — why the first batch was reverted: those entries ended at
# "furthest switch target + 4", an arbitrary address rather than a real
# function boundary. recompiler.cpp walks the code section linearly, adding
# each function's size to `base`; where no function starts it calls
# Function::Analyze, which begins at size 0 and returns 0 if its block stack
# empties immediately. `base += 0` then loops forever, and the recompiler
# hangs producing no output at all. Function ends must therefore land just
# past a terminator. Fixed in xex_info; regenerate with the command above.
# ----------------------------------------------------------------------------
functions = [
    # Regenerate with:
    #   tools/xex_info/build/xex_info private/default.xex \
    #       --fix-switches WoSRecompLib/config/WoS_switch_tables.toml \
    #       --write-config WoSRecompLib/config/WoS_config.toml
]

# ----------------------------------------------------------------------------
# Invalid instruction skips.
# Non-code data embedded in .text (padding, exception frame tables, etc.)
# ----------------------------------------------------------------------------
invalid_instructions = [
    { data = 0x00000000, size = 4 },  # example: padding — replace/remove
]

# ----------------------------------------------------------------------------
# Mid-asm hooks.
# This is how WoSRecomp/ runtime code gets spliced into recompiled game code
# (graphics calls, save I/O, audio, etc). Add one [[midasm_hook]] block per
# injection point as you discover the need for them during bring-up.
# ----------------------------------------------------------------------------
# [[midasm_hook]]
# name = "ExampleMidAsmHook"
# address = 0x00000000
# registers = ["r3"]
